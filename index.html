<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Pakjiwoo Studio photography portfolio">
<title>PAKJIWOO STUDIO</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="sidebar">
  <button class="brand" data-route="home">PAKJIWOO<br>STUDIO</button>
  <nav>
    <button data-route="project">PROJECT</button>
    <button data-route="commercial">COMMERCIAL</button>
    <button data-route="contact">CONTACT</button>
  </nav>
</aside>

<main>
  <section id="home" class="view active">
    <div class="hero">
      <img id="heroImage" alt="Featured photograph">
      <button id="prevHero" class="hero-zone left" aria-label="Previous"></button>
      <button id="nextHero" class="hero-zone right" aria-label="Next"></button>
      <div class="hero-caption"><span id="heroTitle">HOME</span><span id="heroCount"></span></div>
    </div>
  </section>

  <section id="project" class="view archive">
    <div class="archive-head">
      <span class="eyebrow">PROJECT</span>
      <div id="projectList" class="project-list"></div>
    </div>
    <div id="projectFeed" class="editorial-feed"></div>
  </section>

  <section id="commercial" class="view archive">
    <div class="archive-head">
      <span class="eyebrow">COMMERCIAL</span>
      <div id="commercialList" class="commercial-list"></div>
    </div>
    <div id="commercialFeed" class="editorial-feed"></div>
  </section>

  <section id="contact" class="view contact">
    <span class="eyebrow">CONTACT</span>
    <a href="mailto:gwoocolor@gmail.com">gwoocolor@gmail.com</a>
    <a href="https://instagram.com/pakjiwoo" target="_blank" rel="noreferrer">@pakjiwoo</a>
  </section>

  <section id="collection" class="view collection-view">
    <div class="collection-head">
      <button id="collectionBack">← PROJECT</button>
      <div>
        <h1 id="collectionTitle"></h1>
        <div id="collectionList" class="campaign-list"></div>
      </div>
    </div>
    <div id="collectionFeed" class="editorial-feed"></div>
  </section>

  <section id="brand" class="view brand-view">
    <div class="brand-head">
      <button id="brandBack">← COMMERCIAL</button>
      <div>
        <h1 id="brandTitle"></h1>
        <p id="brandDescription"></p>
        <div id="campaignList" class="campaign-list"></div>
      </div>
    </div>
    <div id="brandFeed" class="editorial-feed"></div>
  </section>

  <section id="detail" class="view detail">
    <div class="detail-top">
      <button id="backBtn">← BACK</button>
      <span id="detailTitle"></span>
    </div>
    <div id="detailGallery" class="detail-gallery"></div>
  </section>
</main>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button id="closeLightbox" class="close-lightbox" aria-label="Close">×</button>
  <button id="lightPrev" class="light-zone left" aria-label="Previous image"></button>
  <div id="lightboxStage" class="lightbox-stage"><img id="lightImage" alt="Expanded photograph"></div>
  <button id="lightNext" class="light-zone right" aria-label="Next image"></button>
  <div id="lightCounter" class="light-counter"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
